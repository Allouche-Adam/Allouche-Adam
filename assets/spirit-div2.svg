<style>@keyframes c60{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(-43px,-56px) scale(1.15)}66%{transform:translate(26px,-45px) scale(.9)}}@keyframes c61{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(-11px,-48px) scale(1.15)}66%{transform:translate(6px,-38px) scale(.9)}}@keyframes c62{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(-8px,41px) scale(1.15)}66%{transform:translate(5px,33px) scale(.9)}}@keyframes c63{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(105px,45px) scale(1.15)}66%{transform:translate(-63px,36px) scale(.9)}}@keyframes tw{0%,100%{opacity:.1}50%{opacity:.95}}.spk{fill:#FFF3FB;animation:tw ease-in-out infinite;font-family:Arial,sans-serif}@keyframes draw{0%{stroke-dashoffset:var(--l);opacity:.9}45%,75%{stroke-dashoffset:0;opacity:.9}95%,100%{stroke-dashoffset:0;opacity:0}}
