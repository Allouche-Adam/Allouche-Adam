<style>@keyframes c20{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(-91px,11px) scale(1.15)}66%{transform:translate(55px,9px) scale(.9)}}@keyframes c21{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(38px,19px) scale(1.15)}66%{transform:translate(-23px,15px) scale(.9)}}@keyframes c22{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(41px,-26px) scale(1.15)}66%{transform:translate(-24px,-21px) scale(.9)}}@keyframes c23{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(57px,23px) scale(1.15)}66%{transform:translate(-34px,18px) scale(.9)}}@keyframes c24{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(69px,17px) scale(1.15)}66%{transform:translate(-41px,14px) scale(.9)}}@keyframes c25{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(126px,60px) scale(1.15)}66%{transform:translate(-75px,48px) scale(.9)}}@keyframes tw{0%,100%{opacity:.1}50%{opacity:.95}}.spk{fill:#FFF3FB;animation:tw ease-in-out infinite;font-family:Arial,sans-serif}@keyframes wave{0%,100%{transform:translateY(0);fill:#FFFFFF}25%{transform:translateY(-12px);fill:#FFD1F0}50%{transform:translateY(0);fill:#FFFFFF}}.lt{animation:wave 3.6s ease-in-out infinite}text{font-family:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace;white-space:pre;font-weight:700}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
