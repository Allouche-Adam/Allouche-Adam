<svg xmlns="http://www.w3.org/2000/svg" width="900" height="120" viewBox="0 0 900 120" role="img" aria-label="Flowing glowing colors">
<defs><clipPath id="frame"><rect width="900" height="120" rx="18"/></clipPath><filter id="blur" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1300" height="520"><feGaussianBlur stdDeviation="48"/></filter><radialGradient id="calm"><stop offset="0" stop-color="#0B0614" stop-opacity=".55"/><stop offset="1" stop-color="#0B0614" stop-opacity="0"/></radialGradient>
